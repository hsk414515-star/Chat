<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="preconnect" href="https://broker.emqx.io">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>چت خصوصی</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0f1720;color:#e6edf3;overflow:hidden}
  body{position:fixed;inset:0}
  .hidden{display:none!important}

  #login{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:24px;gap:16px}
  #login h1{font-size:22px;font-weight:600}
  #login p{color:#8b98a5;font-size:13px;text-align:center;max-width:280px;line-height:1.7}
  #codeInput{width:100%;max-width:320px;padding:14px;border-radius:12px;border:1px solid #2a3644;background:#16202b;color:#e6edf3;font-size:17px;letter-spacing:2px;text-align:center;outline:none}
  #codeInput:focus{border-color:#4a90e2}
  #enterBtn{width:100%;max-width:320px;padding:14px;border-radius:12px;border:none;background:#4a90e2;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
  #enterBtn:active{background:#3a7ac2}
  #loginError{color:#ff6b6b;font-size:13px;min-height:18px;text-align:center}

  #chat{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:#16202b;border-bottom:1px solid #2a3644;flex-shrink:0;gap:8px}
  header .peer{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex:1;min-width:0;overflow:hidden}
  header .peer .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d8e2ec}
  header .dot{width:8px;height:8px;border-radius:50%;background:#4a90e2;box-shadow:0 0 8px #4a90e2;flex-shrink:0}
  #logoutBtn{background:#3a2a2a;border:1px solid #5a3a3a;color:#ff9c9c;font-size:11.5px;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
  #logoutBtn:active{background:#5a3a3a}

  #messages{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-thumb{background:#2a3644;border-radius:3px}

  .msg{
    max-width:82%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.45;
    word-wrap:break-word;animation:fade .18s ease-out;position:relative;
    --overlay-bg: rgba(0,0,0,.2);
    --overlay-border: rgba(255,255,255,.5);
  }
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

  .msg.mine{align-self:flex-start;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-end;border-bottom-left-radius:4px}

  .msg.from-hatami{
    background: linear-gradient(135deg,#004D98 0%,#4E1550 50%,#A50044 100%);
    color:#fff;
    --overlay-bg: rgba(255,255,255,.18);
    --overlay-border: rgba(255,255,255,.55);
  }
  .msg.from-armin{
    background:#ffffff;
    color:#1a1a1a;
    box-shadow:0 0 0 1px rgba(254,190,16,.55);
    --overlay-bg: rgba(0,0,0,.05);
    --overlay-border: rgba(0,0,0,.3);
  }

  .msg .text{white-space:pre-wrap;word-break:break-word}
  .msg .edited{font-size:10px;opacity:.7;margin-right:4px}
  .msg .meta{font-size:10px;opacity:.75;margin-top:4px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
  .msg .act{background:transparent;border:none;color:inherit;opacity:.55;font-size:13px;cursor:pointer;padding:1px 3px;font-family:inherit}
  .msg .act:active{opacity:1}

  .msg .team-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;flex-shrink:0;
    margin-left:2px;
    background:#fff;
    border-radius:50%;
    padding:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,.18);
    overflow:hidden;
  }
  .msg .team-icon img{display:block;width:100%;height:100%;object-fit:contain}

  .msg .tick{
    display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;letter-spacing:-3px;
    margin-right:2px;
    color:#c8d3de;
    transition:color .2s;
  }
  .msg.from-armin .tick{color:#8a8a8a}
  .msg .tick.seen{color:#4fc3f7}
  .msg.from-armin .tick.seen{color:#2b9de8}

  .reply-preview{
    background: var(--overlay-bg);
    border-right:3px solid var(--overlay-border);
    padding:4px 8px;border-radius:6px;font-size:12px;opacity:.9;
    margin-bottom:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .reply-preview b{font-weight:600;margin-left:4px}

  .edit-input{
    width:100%;background: var(--overlay-bg);color:inherit;
    border:1px solid var(--overlay-border);border-radius:8px;
    padding:6px 8px;font-size:14px;font-family:inherit;outline:none;
    resize:none;min-height:40px;
  }
  .edit-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
  .edit-actions button{
    background: var(--overlay-bg);border:none;color:inherit;
    padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .edit-actions button.save{background:#2ecc71;color:#fff}

  #replyBanner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#22303e;border-top:1px solid #2a3644;font-size:13px;flex-shrink:0}
  #replyBanner .bar{width:3px;height:26px;background:#4a90e2;border-radius:2px;flex-shrink:0}
  #replyBanner .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8d3de}
  #replyBanner button{background:transparent;border:none;color:#8b98a5;font-size:18px;cursor:pointer;padding:4px 8px;font-family:inherit}

  #composer{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#16202b;border-top:1px solid #2a3644;flex-shrink:0}
  #msgInput{flex:1;padding:12px 16px;border-radius:22px;border:1px solid #2a3644;background:#0f1720;color:#e6edf3;font-size:16px;outline:none;font-family:inherit}
  #msgInput:focus{border-color:#4a90e2}
  #sendBtn{width:46px;height:46px;border-radius:50%;border:none;background:#4a90e2;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
  #sendBtn:active{background:#3a7ac2}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
  .modal-box{background:#16202b;border:1px solid #2a3644;border-radius:16px;padding:18px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px}
  .modal-box p{font-size:15px;margin-bottom:6px;text-align:center}
  .modal-box button{padding:12px;border-radius:10px;border:1px solid #2a3644;background:#0f1720;color:#e6edf3;font-size:15px;cursor:pointer;font-family:inherit}
  .modal-box button:active{background:#22303e}
  .modal-box button.danger{border-color:#7a2a2a;color:#ff9c9c}
  .modal-box button.cancel{background:transparent;color:#8b98a5}
</style>
</head>
<body>

<div id="login">
  <h1>چت </h1>
  <p>کدتو بنوبس</p>
  <input id="codeInput" type="password" placeholder="کدی که داده بودمو بزن" autocomplete="off">
  <button id="enterBtn">ورود</button>
  <div id="loginError"></div>
</div>

<div id="chat" class="hidden">
  <header>
    <div class="peer">
      <span class="dot"></span>
      <span class="txt" id="peerName">…</span>
    </div>
    <button id="logoutBtn">بودو بیرون</button>
  </header>
  <div id="messages"></div>
  <div id="replyBanner" class="hidden">
    <div class="bar"></div>
    <div class="txt" id="replyText"></div>
    <button id="cancelReply">✕</button>
  </div>
  <div id="composer">
    <input id="msgInput" type="text" placeholder="پیام…" autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>
</div>

<div id="deleteModal" class="modal hidden">
  <div class="modal-box">
    <p>این پیام حذف بشه؟</p>
    <button data-scope="me">فقط برای من</button>
    <button data-scope="all" class="danger">برای هر دو نفر</button>
    <button class="cancel">لغو</button>
  </div>
</div>

<script>
// ─── پیش‌بارگذاری MQTT (موازی، قبل از login) ───
var mqttReadyPromise = new Promise(function(resolve, reject){
  var s = document.createElement('script');
  s.src = "https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js";
  s.async = true;
  s.onload = resolve;
  s.onerror = function(){ mqttReadyPromise = null; reject(new Error('mqtt load fail')); };
  document.head.appendChild(s);
});
mqttReadyPromise.catch(function(){});

(function(){
  // ═══════════════════════════════════════════
  // ⚙️ کدها رو اینجا عوض کن
  // ═══════════════════════════════════════════
  const CODES = {
    Hatami: "Hatami",
    Armin:  "Armin"
  };
  // ═══════════════════════════════════════════

  const BROKER = "wss://broker.emqx.io:8084/mqtt";

  const BARCA_LOGO = '<img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" alt="Barça">';
  const REAL_LOGO  = '<img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real">';

  const $ = id => document.getElementById(id);
  const loginEl = $('login'), chatEl = $('chat'), messagesEl = $('messages');
  const codeInput = $('codeInput'), msgInput = $('msgInput'), peerNameEl = $('peerName');
  const loginError = $('loginError'), deleteModal = $('deleteModal');
  const replyBanner = $('replyBanner'), replyText = $('replyText');

  let client = null;
  let myName = null;
  let ROOM_HASH = null;
  let TOPIC_MINE, TOPIC_THEIRS, TOPIC_DELETED, TOPIC_SEEN_MINE, TOPIC_SEEN_THEIRS;
  let myMessages = [];
  let theirMessages = [];
  let deletedIds = new Set();
  let hiddenIds = new Set();
  let messagesById = {};
  let pendingDeleteId = null;
  let editingId = null;
  let replyingTo = null;
  let peerSeenUpTo = 0;
  let lastSeenPublish = 0;

  // ── ابزار ──
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function fmtTime(ts){
    const d = new Date(ts), now = new Date();
    const hh = ('0'+d.getHours()).slice(-2), mm = ('0'+d.getMinutes()).slice(-2);
    if (d.toDateString() === now.toDateString()) return hh + ':' + mm;
    const mo = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2);
    return dd + '/' + mo + '/' + d.getFullYear() + '  ' + hh + ':' + mm;
  }
  const isAtBottom = () => messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
  const scrollBottom = smooth => messagesEl.scrollTo({top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});

  function simpleHash(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }

  async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 20);
  }

  // ── کش hash اتاق ──
  async function getRoomHash(){
    const codesId = CODES.Hatami + '|' + CODES.Armin;
    const key = 'rh_v1_' + simpleHash(codesId);
    let h = localStorage.getItem(key);
    if (h) return h;
    const sorted = [CODES.Hatami, CODES.Armin].sort().join('|');
    h = await sha256(sorted);
    try { localStorage.setItem(key, h); } catch(e){}
    return h;
  }

  // ── کش پیام‌ها (یک کلید سریع، بدون درگیر hash) ──
  function quickKey(user){ return 'chat_q1_' + user; }
  function loadQuick(){
    try {
      const raw = localStorage.getItem(quickKey(myName));
      if (!raw) return false;
      const p = JSON.parse(raw);
      myMessages = p.mine || [];
      theirMessages = p.theirs || [];
      deletedIds = new Set(p.deleted || []);
      hiddenIds = new Set(p.hidden || []);
      peerSeenUpTo = p.peerSeen || 0;
      return true;
    } catch(e){ return false; }
  }
  function saveQuick(){
    try {
      localStorage.setItem(quickKey(myName), JSON.stringify({
        mine: myMessages,
        theirs: theirMessages,
        deleted: [...deletedIds],
        hidden: [...hiddenIds],
        peerSeen: peerSeenUpTo
      }));
    } catch(e){}
  }

  // ── رندر ──
  function renderMessage(m){
    if (messagesById[m.id]) return;

    const mine = m.sender === myName;
    const isHatami = m.sender === 'Hatami';
    const team = isHatami ? 'barca' : 'real';
    const teamLogo = isHatami ? BARCA_LOGO : REAL_LOGO;

    const el = document.createElement('div');
    el.className = 'msg ' + (mine ? 'mine' : 'theirs') + ' from-' + (isHatami ? 'hatami' : 'armin');
    el.dataset.id = m.id;

    let replyHtml = '';
    if (m.replyPreview) {
      replyHtml = '<div class="reply-preview"><b>' + esc(m.replyPreview.sender) + '</b>' +
                  esc((m.replyPreview.text || '').slice(0, 60)) + '</div>';
    }

    const textHtml = '<div class="text">' + esc(m.text) +
      (m.edited ? ' <span class="edited">(ویرایش شده)</span>' : '') + '</div>';

    let tickHtml = '';
    if (mine) {
      const seen = peerSeenUpTo >= m.time;
      tickHtml = '<span class="tick' + (seen ? ' seen' : '') + '">' + (seen ? '✓✓' : '✓') + '</span>';
    }

    const meta = '<div class="meta">' +
      '<span class="team-icon ' + team + '">' + teamLogo + '</span>' +
      '<span>' + fmtTime(m.time) + '</span>' +
      '<button class="act reply" title="پاسخ">↩</button>' +
      (mine ? '<button class="act edit" title="ویرایش">✎</button>' : '') +
      '<button class="act del" title="حذف">🗑</button>' +
      tickHtml +
      '</div>';

    el.innerHTML = replyHtml + textHtml + meta;

    messagesById[m.id] = { data: m, el: el };
    messagesEl.appendChild(el);

    el.querySelector('.reply').onclick = () => setReply(m);
    if (mine) el.querySelector('.edit').onclick = () => startEdit(m);
    el.querySelector('.del').onclick = () => startDelete(m.id);
  }

  function updateTick(id){
    const rec = messagesById[id];
    if (!rec) return;
    const tickEl = rec.el.querySelector('.tick');
    if (!tickEl) return;
    const seen = peerSeenUpTo >= rec.data.time;
    if (seen && !tickEl.classList.contains('seen')) {
      tickEl.classList.add('seen');
      tickEl.textContent = '✓✓';
    }
  }
  function updateAllTicks(){ for (const id in messagesById) updateTick(id); }

  function updateMessageText(id, text, edited){
    const rec = messagesById[id];
    if (!rec) return;
    rec.data.text = text;
    rec.data.edited = !!edited;
    rec.el.querySelector('.text').innerHTML = esc(text) + (edited ? ' <span class="edited">(ویرایش شده)</span>' : '');
  }

  function removeMessage(id){
    const rec = messagesById[id];
    if (!rec) return;
    rec.el.remove();
    delete messagesById[id];
  }

  // ── یک تابع که لیست رو مرتب می‌کنه ──
  function mergeById(a, b){
    const map = new Map();
    a.forEach(m => map.set(m.id, m));
    b.forEach(m => {
      const old = map.get(m.id);
      if (!old || m.time >= old.time) map.set(m.id, m);
    });
    return [...map.values()].sort((x,y) => x.time - y.time);
  }

  function renderAll(){
    const visible = mergeById(myMessages, theirMessages)
      .filter(m => !deletedIds.has(m.id) && !hiddenIds.has(m.id));

    const visibleIds = new Set(visible.map(m => m.id));
    for (const id in messagesById) {
      if (!visibleIds.has(id)) removeMessage(id);
    }

    const stick = isAtBottom();
    let added = 0;
    visible.forEach(m => {
      if (m.id === editingId) return;
      const rec = messagesById[m.id];
      if (!rec) { renderMessage(m); added++; }
      else {
        if (rec.data.text !== m.text || rec.data.edited !== m.edited) {
          updateMessageText(m.id, m.text, m.edited);
        }
        rec.data = m;
      }
    });

    if (added > 0) scrollBottom(false);
    updateAllTicks();
  }

  // ── پاسخ ──
  function setReply(m){
    replyingTo = { id: m.id, sender: m.sender, text: m.text };
    replyText.textContent = m.sender + ': ' + m.text.slice(0, 60);
    replyBanner.classList.remove('hidden');
    msgInput.focus();
  }
  function cancelReply(){ replyingTo = null; replyBanner.classList.add('hidden'); }
  $('cancelReply').onclick = cancelReply;

  // ── ویرایش ──
  function startEdit(m){
    if (editingId) return;
    editingId = m.id;
    const rec = messagesById[m.id];
    const textEl = rec.el.querySelector('.text');
    const original = m.text;

    textEl.innerHTML = '<textarea class="edit-input"></textarea>' +
      '<div class="edit-actions"><button class="cancel">لغو</button><button class="save">ذخیره</button></div>';
    const ta = textEl.querySelector('textarea');
    ta.value = original;
    ta.focus();
    ta.setSelectionRange(original.length, original.length);

    const finish = (newText) => {
      editingId = null;
      if (newText !== null && newText !== original) {
        const mm = myMessages.find(x => x.id === m.id);
        if (mm) { mm.text = newText; mm.edited = true; }
        publishMyHistory();
        saveQuick();
        renderAll();
      } else {
        textEl.innerHTML = esc(original) + (m.edited ? ' <span class="edited">(ویرایش شده)</span>' : '');
      }
    };
    textEl.querySelector('.cancel').onclick = () => finish(null);
    textEl.querySelector('.save').onclick = () => finish(ta.value);
  }

  // ── حذف ──
  function startDelete(id){ pendingDeleteId = id; deleteModal.classList.remove('hidden'); }
  deleteModal.querySelectorAll('button[data-scope]').forEach(b => {
    b.onclick = () => {
      if (!pendingDeleteId) return;
      const id = pendingDeleteId;
      if (b.dataset.scope === 'all') {
        deletedIds.add(id);
        publishDeleted();
      } else {
        hiddenIds.add(id);
      }
      saveQuick();
      renderAll();
      deleteModal.classList.add('hidden');
      pendingDeleteId = null;
    };
  });
  deleteModal.querySelector('.cancel').onclick = () => {
    deleteModal.classList.add('hidden');
    pendingDeleteId = null;
  };

  // ── ارسال ──
  function send(){
    const text = msgInput.value.trim();
    if (!text) return;
    const msg = { id: uid(), sender: myName, text, time: Date.now(), edited: false };
    if (replyingTo) {
      msg.replyPreview = { sender: replyingTo.sender, text: replyingTo.text };
    }
    myMessages.push(msg);
    publishMyHistory();
    saveQuick();
    renderAll();
    scrollBottom(true);
    msgInput.value = '';
    cancelReply();
    msgInput.focus();
  }
  $('sendBtn').onclick = send;
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });

  // ── MQTT ──
  function publishMyHistory(){
    if (!client || !client.connected) return;
    client.publish(TOPIC_MINE, JSON.stringify({ messages: myMessages }), { qos: 1, retain: true });
  }
  function publishDeleted(){
    if (!client || !client.connected) return;
    client.publish(TOPIC_DELETED, JSON.stringify({ ids: [...deletedIds] }), { qos: 1, retain: true });
  }
  function publishSeen(force){
    const now = Date.now();
    if (!force && now - lastSeenPublish < 1500) return;
    lastSeenPublish = now;
    if (!client || !client.connected) return;
    client.publish(TOPIC_SEEN_MINE, JSON.stringify({ t: now }), { qos: 1, retain: true });
  }

  async function connectMQTT(){
    try { await mqttReadyPromise; }
    catch(e) { setTimeout(connectMQTT, 2000); return; }

    client = mqtt.connect(BROKER, {
      clientId: 'chat_' + Math.random().toString(16).slice(2, 12),
      clean: true,
      reconnectPeriod: 2000,
      connectTimeout: 8000,
      keepalive: 30
    });

    client.on('connect', () => {
      client.subscribe(TOPIC_MINE, { qos: 1 });
      client.subscribe(TOPIC_THEIRS, { qos: 1 });
      client.subscribe(TOPIC_DELETED, { qos: 1 });
      client.subscribe(TOPIC_SEEN_THEIRS, { qos: 1 });
      // وقتی وصل شد، خودم رو "دیده" علامت بزن
      setTimeout(() => publishSeen(true), 400);
    });

    client.on('error', e => console.error('MQTT error', e));

    client.on('message', (topic, payload) => {
      let data;
      try { data = JSON.parse(payload.toString()); } catch { return; }

      if (topic === TOPIC_MINE) {
        const serverMsgs = data.messages || [];
        myMessages = mergeById(serverMsgs, myMessages);
        saveQuick();
        renderAll();
        return;
      }

      if (topic === TOPIC_THEIRS) {
        const serverMsgs = data.messages || [];
        const hadCount = theirMessages.length;
        theirMessages = mergeById(serverMsgs, theirMessages);
        saveQuick();
        renderAll();
        if (theirMessages.length > hadCount) publishSeen();
        return;
      }

      if (topic === TOPIC_DELETED) {
        const arr = data.ids || [];
        let changed = false;
        arr.forEach(id => { if (!deletedIds.has(id)) { deletedIds.add(id); changed = true; } });
        if (changed) {
          saveQuick();
          if (client.connected) publishDeleted();
          renderAll();
        }
        return;
      }

      if (topic === TOPIC_SEEN_THEIRS) {
        const t = data.t || 0;
        if (t > peerSeenUpTo) {
          peerSeenUpTo = t;
          saveQuick();
          updateAllTicks();
        }
        return;
      }
    });
  }

  // ── ورود ──
  function tryLogin(code){
    let user = null;
    if (code === CODES.Hatami) user = 'Hatami';
    else if (code === CODES.Armin) user = 'Armin';
    else { loginError.textContent = 'کد اشتباهه'; return; }
    loginError.textContent = '';
    startSession(user, code);
  }

  async function startSession(user, code){
    myName = user;
    const otherName = (user === 'Hatami') ? 'Armin' : 'Hatami';
    peerNameEl.textContent = 'با دلقکی به نام ' + otherName + ' داری حرف می‌زنی';
    localStorage.setItem('chat_user', user);
    localStorage.setItem('chat_code', code);

    // ⚡ اول از کش سریع لود کن و فوری نشون بده
    loadQuick();
    messagesById = {};
    messagesEl.innerHTML = '';
    renderAll();
    scrollBottom(false);

    // ⚡ بعد برو سراغ chat (نمایش فوری)
    loginEl.classList.add('hidden');
    chatEl.classList.remove('hidden');

    // ⚡ hash اتاق رو بگیر (از کش، فوری)
    ROOM_HASH = await getRoomHash();
    TOPIC_MINE        = 'pc/' + ROOM_HASH + '/H/' + myName;
    TOPIC_THEIRS      = 'pc/' + ROOM_HASH + '/H/' + otherName;
    TOPIC_DELETED     = 'pc/' + ROOM_HASH + '/D';
    TOPIC_SEEN_MINE   = 'pc/' + ROOM_HASH + '/S/' + myName;
    TOPIC_SEEN_THEIRS = 'pc/' + ROOM_HASH + '/S/' + otherName;

    // اتصال MQTT در پس‌زمینه
    connectMQTT();

    setTimeout(() => msgInput.focus(), 200);
  }

  // ── خروج ──
  function logout(){
    if (myName) saveQuick();
    if (client) { try { client.end(true); } catch(e){} client = null; }
    localStorage.removeItem('chat_user');
    localStorage.removeItem('chat_code');

    myName = null;
    myMessages = [];
    theirMessages = [];
    deletedIds = new Set();
    hiddenIds = new Set();
    messagesById = {};
    pendingDeleteId = null;
    editingId = null;
    replyingTo = null;
    peerSeenUpTo = 0;
    lastSeenPublish = 0;

    messagesEl.innerHTML = '';
    codeInput.value = '';
    loginError.textContent = '';
    replyBanner.classList.add('hidden');
    deleteModal.classList.add('hidden');

    chatEl.classList.add('hidden');
    loginEl.classList.remove('hidden');
    setTimeout(() => codeInput.focus(), 200);
  }
  $('logoutBtn').onclick = logout;

  // ── رویدادها ──
  $('enterBtn').onclick = () => {
    const code = codeInput.value.trim();
    if (!code) { loginError.textContent = 'کد رو وارد کن'; return; }
    tryLogin(code);
  };
  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('enterBtn').click(); }
  });

  // وقتی برگشت به تب → «دیده» علامت بزن
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && myName && client && client.connected) {
      publishSeen(true);
    }
  });

  // ذخیره دوره‌ای کش
  setInterval(() => { if (myName) saveQuick(); }, 20000);
  window.addEventListener('pagehide', () => { if (myName) saveQuick(); });
  window.addEventListener('beforeunload', () => { if (myName) saveQuick(); });

  // ورود خودکار
  const savedUser = localStorage.getItem('chat_user');
  const savedCode = localStorage.getItem('chat_code');
  if (savedUser && savedCode) {
    const stillValid =
      (savedUser === 'Hatami' && savedCode === CODES.Hatami) ||
      (savedUser === 'Armin'  && savedCode === CODES.Armin);
    if (stillValid) startSession(savedUser, savedCode);
    else { localStorage.removeItem('chat_user'); localStorage.removeItem('chat_code'); }
  }
})();
</script>

 </html>
