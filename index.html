<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="preconnect" href="https://broker.emqx.io" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>چت</title>
<style>
  :root{--bg:#0f1720;--bg-2:#16202b;--header-bg:#16202b;--composer-bg:#16202b;--border:#2a3644;--accent:#4a90e2;--accent-2:#3a7ac2;--text:#e6edf3;--text-mute:#8b98a5;--input-bg:#0f1720;--panel-bg:#16202b}
  body[data-theme="barca"]{--bg:linear-gradient(180deg,#050a1f 0%,#150318 100%);--header-bg:linear-gradient(135deg,#004D98 0%,#A50044 100%);--composer-bg:#0a0f22;--border:rgba(165,0,68,.4);--accent:#A50044;--accent-2:#8a0038;--input-bg:rgba(255,255,255,.06);--panel-bg:#0d1225;--text:#fff;--text-mute:#d0b8c5}
  body[data-theme="real"]{--bg:linear-gradient(180deg,#f7f7f2 0%,#eae5d5 100%);--header-bg:linear-gradient(135deg,#ffffff 0%,#e8d28a 100%);--composer-bg:#fafaf3;--border:rgba(201,162,39,.65);--accent:#C9A227;--accent-2:#a8851c;--input-bg:#fff;--panel-bg:#fff;--text:#1a1a1a;--text-mute:#7a7a7a}
  body[data-theme="gray"]{--bg:#1e1e1e;--header-bg:#2a2a2a;--composer-bg:#2a2a2a;--border:#3a3a3a;--accent:#6b7280;--accent-2:#4b5563;--input-bg:#151515;--panel-bg:#2a2a2a;--text:#e6e6e6;--text-mute:#9ca3af}
  body[data-theme="black"]{--bg:#000;--header-bg:#0a0a0a;--composer-bg:#0a0a0a;--border:#1a1a1a;--accent:#4a90e2;--accent-2:#3a7ac2;--input-bg:#050505;--panel-bg:#0a0a0a;--text:#f0f0f0;--text-mute:#707070}
  body[data-theme="blue"]{--bg:linear-gradient(180deg,#0a1929 0%,#06121e 100%);--header-bg:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);--composer-bg:#0a1929;--border:rgba(59,130,246,.4);--accent:#3b82f6;--accent-2:#2563eb;--input-bg:rgba(255,255,255,.06);--panel-bg:#0f1e30;--text:#fff;--text-mute:#93b8e0}
  body[data-theme="green"]{--bg:linear-gradient(180deg,#051a12 0%,#031009 100%);--header-bg:linear-gradient(135deg,#065f46 0%,#10b981 100%);--composer-bg:#051a12;--border:rgba(16,185,129,.4);--accent:#10b981;--accent-2:#059669;--input-bg:rgba(255,255,255,.06);--panel-bg:#0a2419;--text:#fff;--text-mute:#a0d5b8}
  body[data-theme="real"] .date-sep{background:rgba(0,0,0,.08);color:#555}
  body[data-theme="real"] #msgInput{color:#1a1a1a;background:#fff}
  body[data-theme="real"] #msgInput::placeholder{color:#aaa}
  body[data-theme="real"] .reply-preview{background:rgba(0,0,0,.06);color:#333}
  body[data-theme="real"] #replyBanner{background:#fafaf3}
  body[data-theme="real"] #replyBanner .txt{color:#333}
  body[data-theme="real"] #themeSheet{box-shadow:0 -4px 20px rgba(0,0,0,.15)}
  body[data-theme="real"] .modal-box p{color:#1a1a1a}
  body[data-theme="real"] #login p{color:#888}
  body[data-theme="real"] #login h1{color:#1a1a1a}
  body[data-theme="real"] .sheet-title{color:#1a1a1a}
  body[data-theme="real"] .sheet-handle{background:rgba(0,0,0,.15)}
  body[data-theme="real"] #themeBtn,body[data-theme="real"] #logoutBtn{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);color:#1a1a1a}
  body[data-theme="real"] #logoutBtn{color:#a05252;border-color:rgba(160,82,82,.3)}
  body[data-theme="real"] .peer-info .name{color:#1a1a1a}
  body[data-theme="real"] header{border-bottom-color:rgba(0,0,0,.08)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s}
  body{position:fixed;inset:0}
  .hidden{display:none!important}
  #login{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:24px;gap:16px}
  #login h1{font-size:22px;font-weight:600}
  #login p{color:var(--text-mute);font-size:13px;text-align:center;max-width:280px;line-height:1.7}
  #codeInput{width:100%;max-width:320px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);font-size:17px;letter-spacing:2px;text-align:center;outline:none}
  #codeInput:focus{border-color:var(--accent)}
  #enterBtn{width:100%;max-width:320px;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
  #loginError{color:#ff6b6b;font-size:13px;min-height:18px;text-align:center}
  #chat{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;transition:background .3s}
  header .peer{display:flex;gap:10px;align-items:center;flex:1;min-width:0;overflow:hidden}
  header .peer-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.15);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;border:2px solid rgba(255,255,255,.2)}
  header .peer-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  header .peer-avatar .default{font-size:18px;opacity:.85}
  header .peer-avatar .status-dot{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:#7a7a7a;border:2px solid var(--header-bg);transition:background .3s}
  header .peer-avatar .status-dot.online{background:#2ecc71}
  header .peer-avatar .status-dot.typing{background:#4fc3f7;animation:pulse 1s infinite}
  header .peer-avatar .status-dot.offline{background:#7a7a7a}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  header .peer-info{display:flex;flex-direction:column;min-width:0;flex:1}
  header .peer-info .name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .peer-info .status{font-size:11px;color:var(--text-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  header .peer-info .status.online{color:#2ecc71}
  header .peer-info .status.typing{color:#4fc3f7}
  #themeBtn,#logoutBtn{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);color:inherit;font-size:11.5px;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
  #themeBtn{padding:6px 8px;font-size:14px}
  #messages{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;background-size:cover;background-position:center;background-repeat:no-repeat;position:relative}
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  #messages.has-wallpaper::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.35);pointer-events:none;z-index:0}
  body[data-theme="real"] #messages.has-wallpaper::before{background:rgba(255,255,255,.5)}
  #messages > *{position:relative;z-index:1}
  .date-sep{align-self:center;background:rgba(255,255,255,.1);color:var(--text-mute);font-size:11px;padding:4px 12px;border-radius:999px;margin:10px 0 6px;user-select:none}
  .msg{max-width:82%;padding:8px 12px 6px;border-radius:16px;font-size:15px;line-height:1.45;word-wrap:break-word;animation:fade .18s ease-out;position:relative;--overlay-bg:rgba(0,0,0,.2);--overlay-border:rgba(255,255,255,.5);user-select:none;-webkit-touch-callout:none;transition:box-shadow .3s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .msg.mine{align-self:flex-start;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-end;border-bottom-left-radius:4px}
  .msg.from-hatami{background:linear-gradient(135deg,#004D98 0%,#4E1550 50%,#A50044 100%);color:#fff;--overlay-bg:rgba(255,255,255,.18);--overlay-border:rgba(255,255,255,.55)}
  .msg.from-armin{background:#fff;color:#1a1a1a;box-shadow:0 0 0 1.5px rgba(201,162,39,.75);--overlay-bg:rgba(0,0,0,.05);--overlay-border:rgba(0,0,0,.3)}
  .msg.highlighted::before{content:'';position:absolute;inset:-4px;border:3px solid #4fc3f7;border-radius:20px;animation:highlight-fade 1.6s ease-out;pointer-events:none;z-index:5}
  @keyframes highlight-fade{0%{opacity:0;transform:scale(.95)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
  .msg .text{white-space:pre-wrap;word-break:break-word}
  .msg .edited{font-size:10px;opacity:.7;margin-right:4px}
  .msg .meta{font-size:10px;opacity:.75;margin-top:4px;display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .msg .act{background:transparent;border:none;color:inherit;opacity:.6;font-size:14px;cursor:pointer;padding:1px 4px;font-family:inherit;line-height:1}
  .msg .team-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex-shrink:0;margin-left:2px;background:#fff;border-radius:50%;padding:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18);overflow:hidden}
  .msg .team-icon img{display:block;width:100%;height:100%;object-fit:contain}
  .msg .tick{display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:-3px;margin-right:2px;color:#c8d3de;transition:color .2s}
  .msg.from-armin .tick{color:#8a8a8a}
  .msg .tick.seen{color:#4fc3f7}
  .msg.from-armin .tick.seen{color:#2b9de8}
  .msg .media{margin:2px 0 6px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.15);max-width:100%;position:relative}
  .msg .media img{display:block;width:100%;max-height:380px;object-fit:cover;border-radius:12px;cursor:pointer}
  .msg .media .chunk-progress{padding:20px 14px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:8px;align-items:center;min-width:180px}
  .msg .media .chunk-progress .bar-bg{width:100%;height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
  .msg .media .chunk-progress .bar-fill{height:100%;background:#4fc3f7;transition:width .25s;border-radius:3px}
  .msg .audio-msg{margin:2px 0 6px;display:flex;align-items:center;gap:8px;padding:4px 6px;background:rgba(0,0,0,.18);border-radius:12px;min-width:200px;max-width:100%}
  .msg.from-armin .audio-msg{background:rgba(0,0,0,.06)}
  .msg .audio-msg audio{flex:1;height:36px;min-width:0}
  .msg .audio-msg .rec-icon{font-size:18px;flex-shrink:0;opacity:.85}
  .msg .audio-loading{padding:14px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;min-width:180px}
  .msg .audio-loading .bar-bg{width:100%;height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
  .msg .audio-loading .bar-fill{height:100%;background:#4fc3f7;transition:width .25s;border-radius:3px}
  .msg .reactions{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
  .msg .reactions .rx{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;font-size:13px;line-height:1.2;cursor:pointer;border:1px solid transparent;transition:all .15s}
  .msg.from-armin .reactions .rx{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.12)}
  .msg .reactions .rx.mine{border-color:#4fc3f7;background:rgba(79,195,247,.3)}
  .msg.from-armin .reactions .rx.mine{border-color:#2b9de8;background:rgba(43,157,232,.18)}
  .msg .reactions .rx .count{font-size:11px;opacity:.9}
  #emojiPanel{position:fixed;bottom:66px;right:12px;background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;padding:8px;z-index:90;box-shadow:0 -4px 20px rgba(0,0,0,.5);max-width:calc(100vw - 24px)}
  #emojiPanel .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  #emojiPanel button{background:transparent;border:none;color:inherit;font-size:24px;padding:6px;cursor:pointer;border-radius:8px;font-family:inherit;line-height:1}
  #reactionPicker,#themeSheet{position:fixed;bottom:0;left:0;right:0;background:var(--panel-bg);border-top:1px solid var(--border);padding:14px;z-index:95;animation:slideUp .2s ease-out;padding-bottom:max(14px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.5)}
  #reactionPicker{display:flex;justify-content:center;gap:24px}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  #reactionPicker button{background:rgba(255,255,255,.08);border:2px solid transparent;font-size:32px;width:60px;height:60px;border-radius:50%;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .15s}
  #reactionPicker button.active{border-color:#4fc3f7;background:rgba(79,195,247,.25)}
  #themeSheet{border-top-left-radius:20px;border-top-right-radius:20px;padding:10px 14px;max-height:85vh;overflow-y:auto}
  #themeSheet .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px}
  #themeSheet .sheet-title{text-align:center;font-size:14px;font-weight:600;color:var(--text);margin:10px 0 10px}
  .my-profile{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(127,127,127,.08);margin-bottom:10px}
  .my-avatar-btn{width:56px;height:56px;border-radius:50%;flex-shrink:0;background:rgba(127,127,127,.15);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border:2px solid var(--border);font-size:24px}
  .my-avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
  .my-avatar-btn::after{content:'📷';position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel-bg)}
  .my-profile-info{flex:1;min-width:0}
  .my-profile-info .label{font-size:12px;color:var(--text-mute);margin-bottom:2px}
  .my-profile-info .value{font-size:14px;font-weight:600;color:var(--text)}
  .delete-avatar-btn{background:rgba(255,122,122,.15);border:1px solid rgba(255,122,122,.4);color:#ff7a7a;font-size:16px;width:40px;height:40px;border-radius:50%;cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .sheet-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(127,127,127,.08);margin-bottom:10px;cursor:pointer;font-size:14px;color:var(--text)}
  .sheet-row .row-icon{font-size:18px}
  .sheet-row .row-text{flex:1;text-align:right}
  .sheet-row .row-value{font-size:11px;color:var(--text-mute);margin-right:auto}
  .sheet-row .row-clear{background:transparent;border:none;color:#ff7a7a;font-size:12px;cursor:pointer;padding:4px 8px;font-family:inherit;border-radius:8px}
  #themesGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .theme-option{padding:12px 8px;border-radius:12px;text-align:center;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.6);min-height:54px;display:flex;align-items:center;justify-content:center}
  .theme-option.active{border-color:#4fc3f7;box-shadow:0 0 0 2px rgba(79,195,247,.3)}
  .theme-option.active::before{content:'✓';position:absolute;top:4px;left:6px;font-size:13px;color:#4fc3f7;font-weight:bold;text-shadow:0 0 6px rgba(79,195,247,.9)}
  .theme-option[data-theme="real"]{color:#1a1a1a;text-shadow:0 1px 2px rgba(255,255,255,.6)}
  .theme-option .theme-logo{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .theme-option .theme-logo img{display:block;width:100%;height:100%;object-fit:contain}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:200;padding:12px}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  #lightbox .close{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .reply-preview{background:var(--overlay-bg);border-right:3px solid var(--overlay-border);padding:4px 8px;border-radius:6px;font-size:12px;opacity:.9;margin-bottom:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:background .15s}
  .reply-preview:hover{background:rgba(255,255,255,.25)}
  .reply-preview:active{opacity:.6}
  .reply-preview b{font-weight:600;margin-left:4px}
  .edit-input{width:100%;background:var(--overlay-bg);color:inherit;border:1px solid var(--overlay-border);border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit;outline:none;resize:none;min-height:90px;max-height:240px;line-height:1.5}
  .edit-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  .edit-actions button{background:var(--overlay-bg);border:none;color:inherit;padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .edit-actions button.save{background:#2ecc71;color:#fff}
  #replyBanner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel-bg);border-top:1px solid var(--border);font-size:13px;flex-shrink:0}
  #replyBanner .bar{width:3px;height:26px;background:var(--accent);border-radius:2px;flex-shrink:0}
  #replyBanner .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  #replyBanner button{background:transparent;border:none;color:var(--text-mute);font-size:18px;cursor:pointer;padding:4px 8px;font-family:inherit}
  #composer{display:flex;gap:5px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--composer-bg);border-top:1px solid var(--border);flex-shrink:0;align-items:center;transition:background .3s}
  #composer button.small{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--input-bg);color:var(--text-mute);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;transition:all .15s}
  #composer button.small.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  #voiceBtn.recording{background:#e53935;color:#fff;border-color:#e53935;animation:pulse 1s infinite}
  #msgInput{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:16px;outline:none;font-family:inherit;min-width:0}
  #msgInput:focus{border-color:var(--accent)}
  #sendBtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
  #recordingBar{position:fixed;bottom:70px;left:12px;right:12px;background:#1a1a1a;border-radius:16px;padding:12px 14px;z-index:180;display:flex;align-items:center;gap:12px;box-shadow:0 4px 24px rgba(0,0,0,.6);border:1px solid #333;animation:slideUp .2s ease-out;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  #recordingBar .rec-dot{width:12px;height:12px;border-radius:50%;background:#e53935;animation:pulse 1s infinite;flex-shrink:0}
  #recordingBar .rec-time{font-size:16px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;min-width:48px}
  #recordingBar .rec-hint{flex:1;font-size:12px;color:#999}
  #recordingBar button{background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
  #recordingBar button.send{background:#4a90e2}
  #recordingBar button.cancel{background:rgba(229,57,53,.3);color:#ff8888}
  #uploadIndicator{position:fixed;bottom:80px;right:50%;transform:translateX(50%);background:var(--panel-bg);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;z-index:150;box-shadow:0 4px 20px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;max-width:90vw;border:1px solid var(--border)}
  #uploadIndicator .spinner{width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}

</style>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
  const CODES = { Hatami: "Hatami", Armin: "Armin" };
  const BROKER = "wss://broker.emqx.io:8084/mqtt";
  const MAX_FILE_SIZE = 15 * 1024 * 1024;
  const IMG_MAX_DIM = 1080;
  const IMG_QUALITY = 0.7;
  const AVATAR_SIZE = 240;
  const AVATAR_QUALITY = 0.75;
  const WALL_MAX_DIM = 1280;
  const WALL_QUALITY = 0.5;
  const CHUNK_SIZE = 400 * 1024;
  const CHUNK_DELAY = 150;
  const MAX_VOICE_SEC = 120;
  const MEDIA_KEEP = 30;

  const BARCA_LOGO = '<img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" alt="Barça">';
  const REAL_LOGO  = '<img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real">';
  const EMOJIS = ['🗿','👍','😐','❤️','🎀','🥰','🤣','🥸','😂','🤓','😎'];

  const THEMES = [
    { id: 'barca', name: '', preview: 'linear-gradient(135deg,#004D98 0%,#A50044 100%)', logo: BARCA_LOGO },
    { id: 'real',  name: '', preview: 'linear-gradient(135deg,#ffffff 0%,#C9A227 100%)', logo: REAL_LOGO },
    { id: 'blue',  name: 'آبی', preview: 'linear-gradient(135deg,#1e3a8a 0%,#3b82f6 100%)' },
    { id: 'green', name: 'سبز', preview: 'linear-gradient(135deg,#065f46 0%,#10b981 100%)' },
    { id: 'gray',  name: 'خاکستری', preview: 'linear-gradient(135deg,#4a4a4a 0%,#2a2a2a 100%)' },
    { id: 'black', name: 'سیاه', preview: 'linear-gradient(135deg,#1a1a1a 0%,#000 100%)' }
  ];

  const $ = id => document.getElementById(id);
  const loginEl = $('login'), chatEl = $('chat'), messagesEl = $('messages');
  const codeInput = $('codeInput'), msgInput = $('msgInput');
  const peerNameEl = $('peerName'), peerStatusEl = $('peerStatus'), peerDotEl = $('peerDot');
  const peerAvatarEl = $('peerAvatar'), peerAvatarDefault = $('peerAvatarDefault');
  const loginError = $('loginError'), deleteModal = $('deleteModal');
  const replyBanner = $('replyBanner'), replyText = $('replyText');
  const fileInput = $('fileInput'), attachBtn = $('attachBtn');
  const avatarInput = $('avatarInput'), myAvatarBtn = $('myAvatarBtn');
  const deleteAvatarBtn = $('deleteAvatarBtn'), myNameValue = $('myNameValue');
  const wallpaperInput = $('wallpaperInput'), wallpaperRow = $('wallpaperRow');
  const wallpaperValue = $('wallpaperValue'), clearWallpaper = $('clearWallpaper');
  const emojiBtn = $('emojiBtn'), emojiPanel = $('emojiPanel'), emojiGrid = $('emojiGrid');
  const voiceBtn = $('voiceBtn');
  const reactionPicker = $('reactionPicker');
  const themeSheet = $('themeSheet'), themesGrid = $('themesGrid');
  const themeBtn = $('themeBtn');
  const backdrop = $('backdrop');
  const uploadIndicator = $('uploadIndicator'), uploadText = $('uploadText');
  const lightbox = $('lightbox'), lightboxImg = $('lightboxImg');
  const recordingBar = $('recordingBar'), recTime = $('recTime');
  const micGuideModal = $('micGuideModal');
  const micGuideText = $('micGuideText');
  const micGuideOk = $('micGuideOk');

  let client = null, myName = null, ROOM_HASH = null;
  let TOPIC_MINE, TOPIC_THEIRS, TOPIC_DELETED, TOPIC_SEEN_MINE, TOPIC_SEEN_THEIRS;
  let TOPIC_THEME_MINE, TOPIC_TYPING_MINE, TOPIC_TYPING_THEIRS;
  let TOPIC_AVATAR_MINE, TOPIC_AVATAR_THEIRS, TOPIC_WALL_MINE;
  let CHUNK_BASE = null, REACTION_BASE = null;
  let myMessages = [], theirMessages = [];
  let deletedIds = new Set(), hiddenIds = new Set();
  let messagesById = {};
  let pendingDeleteId = null, editingId = null, replyingTo = null;
  let peerSeenUpTo = 0, lastSeenPublish = 0;
  let seenHeartbeat = null, statusTimer = null, reactionTargetId = null;
  let currentTheme = 'black';
  let pendingChunks = {}, receivingState = {};
  let peerTypingTimeout = null, lastTypingSignal = 0;
  let remoteReactions = {};

  let mediaRecorder = null, audioStream = null, audioChunks = [];
  let isRecording = false, recTimerInterval = null, recStartTime = 0, recCanceled = false;

  function ensureChunkSubscription(msgId){
    if(!client || !client.connected || !CHUNK_BASE) return;
    try { client.subscribe(CHUNK_BASE + '/' + msgId + '/#', {qos:1}); } catch(e){}
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const delay = ms => new Promise(r => setTimeout(r, ms));
  const fmtDur = sec => Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0');

  function toJalali(gy, gm, gd){
    const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
    let jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
    const gy2=(gm>2)?(gy+1):gy;
    let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1];
    jy+=33*Math.floor(days/12053); days%=12053;
    jy+=4*Math.floor(days/1461); days%=1461;
    if(days>365){jy+=Math.floor((days-1)/365); days=(days-1)%365;}
    const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
    const jd=1+((days<186)?(days%31):((days-186)%30));
    return [jy,jm,jd];
  }
  const J_MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
  function formatDateSeparator(ts){
    const d=new Date(ts), now=new Date();
    const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const thatDay=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const diffDays=Math.round((today-thatDay)/(24*3600*1000));
    if(diffDays===0)return 'امروز';
    if(diffDays===1)return 'دیروز';
    if(diffDays<7)return diffDays+' روز پیش';
    const [jy,jm,jd]=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
    return jd+' '+J_MONTHS[jm-1]+' '+jy;
  }
  function fmtTime(ts){const d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  function formatRelative(ts){
    const diff=Date.now()-ts;
    if(diff<60*1000)return 'آنلاین';
    const mins=Math.floor(diff/60000);
    if(mins<60)return 'آخرین بازدید '+mins+' دقیقه پیش';
    const hours=Math.floor(mins/60);
    if(hours<24)return 'آخرین بازدید '+hours+' ساعت پیش';
    const days=Math.floor(hours/24);
    if(days<30)return 'آخرین بازدید '+days+' روز پیش';
    const d=new Date(ts); const [jy,jm,jd]=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
    return 'آخرین بازدید '+jd+' '+J_MONTHS[jm-1];
  }

  const isAtBottom = () => messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
  const scrollBottom = smooth => messagesEl.scrollTo({top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});

  function simpleHash(str){
    let h1=0xdeadbeef,h2=0x41c6ce57;
    for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
  }
  async function sha256(str){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20);
  }
  async function getRoomHash(){
    const codesId=CODES.Hatami+'|'+CODES.Armin;
    const key='rh_v15_'+simpleHash(codesId);
    let h=localStorage.getItem(key);
    if(h)return h;
    const sorted=[CODES.Hatami,CODES.Armin].sort().join('|');
    h=await sha256(sorted);
    try{localStorage.setItem(key,h);}catch(e){}
    return h;
  }

  function stripData(arr){
    const result = arr.map(m => Object.assign({}, m));
    let mediaCount = 0;
    for (let i = result.length - 1; i >= 0; i--) {
      const m = result[i];
      if (m.media && m.media.data) {
        mediaCount++;
        if (mediaCount > MEDIA_KEEP) {
          const copy = Object.assign({}, m);
          copy.media = Object.assign({}, copy.media);
          delete copy.media.data;
          result[i] = copy;
        }
      }
    }
    return result;
  }
  const quickKey = user => 'chat_q15_' + user;
  function loadQuick(){
    try{
      const raw=localStorage.getItem(quickKey(myName));
      if(!raw)return false;
      const p=JSON.parse(raw);
      myMessages=p.mine||[]; theirMessages=p.theirs||[];
      deletedIds=new Set(p.deleted||[]); hiddenIds=new Set(p.hidden||[]);
      peerSeenUpTo=p.peerSeen||0;
      remoteReactions=p.reactions||{};
      return true;
    }catch(e){return false;}
  }
  function saveQuick(){
    try{
      localStorage.setItem(quickKey(myName),JSON.stringify({
        mine:stripData(myMessages),theirs:stripData(theirMessages),
        deleted:[...deletedIds],hidden:[...hiddenIds],peerSeen:peerSeenUpTo,
        reactions:remoteReactions
      }));
    }catch(e){
      try{
        const noMedia=arr=>arr.map(m=>m.media?Object.assign({},m,{media:Object.assign({},m.media,{data:null})}):m);
        localStorage.setItem(quickKey(myName),JSON.stringify({
          mine:noMedia(myMessages),theirs:noMedia(theirMessages),
          deleted:[...deletedIds],hidden:[...hiddenIds],peerSeen:peerSeenUpTo,
          reactions:remoteReactions
        }));
      }catch(e2){}
    }
  }

  function applyTheme(id, save){
    if(!THEMES.find(t=>t.id===id))id='black';
    currentTheme=id;
    document.body.dataset.theme=id;
    themesGrid.querySelectorAll('.theme-option').forEach(el=>el.classList.toggle('active',el.dataset.theme===id));
    const metaTheme=document.querySelector('meta[name="theme-color"]');
    if(metaTheme){
      const colors={barca:'#004D98',real:'#ffffff',gray:'#1e1e1e',black:'#000',blue:'#1e3a8a',green:'#065f46'};
      metaTheme.setAttribute('content',colors[id]||'#0f1720');
    }
    if(save){
      try{localStorage.setItem('chat_theme_'+myName,id);}catch(e){}
      if(client&&client.connected&&TOPIC_THEME_MINE){
        client.publish(TOPIC_THEME_MINE,JSON.stringify({theme:id}),{qos:1,retain:true});
      }
    }
  }

  function applyWallpaper(dataUrl){
    if(dataUrl){
      messagesEl.style.backgroundImage='url("'+dataUrl+'")';
      messagesEl.classList.add('has-wallpaper');
      wallpaperValue.textContent='فعال';
      clearWallpaper.classList.remove('hidden');
    }else{
      messagesEl.style.backgroundImage='';
      messagesEl.classList.remove('has-wallpaper');
      wallpaperValue.textContent='';
      clearWallpaper.classList.add('hidden');
    }
  }
  function saveWallpaper(dataUrl){
    try{
      if(dataUrl)localStorage.setItem('chat_wall_'+myName,dataUrl);
      else localStorage.removeItem('chat_wall_'+myName);
    }catch(e){}
    if(client&&client.connected&&TOPIC_WALL_MINE){
      client.publish(TOPIC_WALL_MINE, dataUrl?JSON.stringify({data:dataUrl}):'', {qos:1,retain:true});
    }
  }
  function loadWallpaperFromCache(){
    let w=null;
    try{ w=localStorage.getItem('chat_wall_'+myName); }catch(e){}
    applyWallpaper(w || null);
  }

  function applyMyAvatar(dataUrl){
    if(dataUrl){
      myAvatarBtn.innerHTML='<img src="'+dataUrl+'" alt="">';
      deleteAvatarBtn.classList.remove('hidden');
    }else{
      myAvatarBtn.innerHTML='<span id="myAvatarDefault" style="font-size:24px">👤</span>';
      deleteAvatarBtn.classList.add('hidden');
    }
  }
  function applyPeerAvatar(dataUrl){
    if(dataUrl){
      peerAvatarEl.querySelectorAll('img').forEach(i=>i.remove());
      const img=document.createElement('img');
      img.src=dataUrl;
      peerAvatarEl.insertBefore(img,peerAvatarEl.firstChild);
      peerAvatarDefault.style.display='none';
    }else{
      peerAvatarEl.querySelectorAll('img').forEach(i=>i.remove());
      peerAvatarDefault.style.display='';
    }
  }
  function saveMyAvatar(dataUrl){
    try{
      if(dataUrl)localStorage.setItem('chat_avatar_'+myName,dataUrl);
      else localStorage.removeItem('chat_avatar_'+myName);
    }catch(e){}
    if(client&&client.connected&&TOPIC_AVATAR_MINE){
      client.publish(TOPIC_AVATAR_MINE, dataUrl?JSON.stringify({data:dataUrl}):'', {qos:1,retain:true});
    }
  }
  function loadAvatarFromCache(){
    let a=null;
    try{ a=localStorage.getItem('chat_avatar_'+myName); }catch(e){}
    applyMyAvatar(a || null);
  }

  function updatePeerStatus(){
    if(peerTypingTimeout)return;
    if(!peerSeenUpTo){
      peerDotEl.className='status-dot offline';
      peerStatusEl.className='status';
      peerStatusEl.textContent='آفلاین';
      return;
    }
    const diff=Date.now()-peerSeenUpTo;
    if(diff<60*1000){
      peerDotEl.className='status-dot online';
      peerStatusEl.className='status online';
      peerStatusEl.textContent='آنلاین';
    }else{
      peerDotEl.className='status-dot offline';
      peerStatusEl.className='status';
      peerStatusEl.textContent=formatRelative(peerSeenUpTo);
    }
  }
  function showPeerTyping(){
    if(!peerSeenUpTo||Date.now()-peerSeenUpTo>90000)return;
    peerDotEl.className='status-dot typing';
    peerStatusEl.className='status typing';
    peerStatusEl.textContent='در حال تایپ...';
    if(peerTypingTimeout)clearTimeout(peerTypingTimeout);
    peerTypingTimeout=setTimeout(()=>{peerTypingTimeout=null;updatePeerStatus();},3500);
  }

  function renderReactions(m){
    const rx=m.reactions||{};
    const keys=Object.keys(rx).filter(k=>rx[k]&&rx[k].length);
    if(!keys.length)return '';
    let html='<div class="reactions">';
    keys.forEach(emoji=>{
      const users=rx[emoji];
      const mine=users.includes(myName);
      html+='<span class="rx'+(mine?' mine':'')+'" data-emoji="'+emoji+'" data-msgid="'+m.id+'">'+emoji+'<span class="count">'+users.length+'</span></span>';
    });
    html+='</div>';
    return html;
  }
  function renderMediaHtml(m){
    if(!m.media)return '';
    const type=m.media.type||'image';
    if(m.media.data){
      if(type==='audio'){
        return '<div class="audio-msg"><span class="rec-icon">🎤</span><audio controls preload="metadata" src="'+m.media.data+'"></audio></div>';
      }
      return '<div class="media"><img src="'+m.media.data+'" alt="عکس" loading="lazy"></div>';
    }
    if(m.media.chunks){
      const recv=receivingState[m.id];
      const pct=recv?Math.round(recv.received/recv.total*100):0;
      if(type==='audio'){
        return '<div class="audio-loading"><div>📥 دریافت صدا… '+pct+'%</div><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
      }
      return '<div class="media"><div class="chunk-progress"><div>📥 در حال دریافت… '+pct+'%</div><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div></div></div>';
    }
    return '';
  }

  function createMessageEl(m){
    const mine=m.sender===myName;
    const isHatami=m.sender==='Hatami';
    const team=isHatami?'barca':'real';
    const teamLogo=isHatami?BARCA_LOGO:REAL_LOGO;

    const el=document.createElement('div');
    el.className='msg '+(mine?'mine':'theirs')+' from-'+(isHatami?'hatami':'armin');
    el.dataset.id=m.id; el.dataset.time=m.time; el.dataset.day=dayKey(m.time);

    let replyHtml='';
    if(m.replyPreview){
      let pText=m.replyPreview.text||'';
      if(!pText&&m.replyPreview.hasImage)pText='📷 عکس';
      if(!pText&&m.replyPreview.hasAudio)pText='🎤 پیام صوتی';
      const rpId=m.replyPreview.id||'';

  function mergeById(a,b){
    const map=new Map();
    a.forEach(m=>map.set(m.id,m));
    b.forEach(local=>{
      const remote=map.get(local.id);
      if(!remote){map.set(local.id,local);return;}
      const merged=Object.assign({},remote);
      if(local.media&&local.media.data){
        merged.media=Object.assign({},remote.media||{},local.media);
      }
      if((!remote.reactions||!Object.keys(remote.reactions).length)&&local.reactions&&Object.keys(local.reactions).length){
        merged.reactions=local.reactions;
      }
      map.set(local.id,merged);
    });
    return [...map.values()].sort((x,y)=>x.time-y.time);
  }

    receivingState[m.id]={received:0,total:m.media.chunks};

  function handleChunkMessage(topic, payload){
    const parts=topic.split('/');
    const idx=parseInt(parts[parts.length-1]);
    const msgId=parts[parts.length-2];
    if(isNaN(idx)||!msgId)return;
    const pc=pendingChunks[msgId]; if(!pc)return;
    if(pc.chunks[idx]!==undefined)return;
    pc.chunks[idx]=payload.toString();
    const recv=receivingState[msgId]; if(recv)recv.received++;
    updateProgressUI(msgId);
    let complete=true;
    for(let i=0;i<pc.total;i++){if(pc.chunks[i]===undefined){complete=false;break;}}
    if(complete){
      const arr=[]; for(let i=0;i<pc.total;i++)arr.push(pc.chunks[i]);
      const dataUrl=arr.join('');
      const m=myMessages.find(x=>x.id===msgId)||theirMessages.find(x=>x.id===msgId);
      if(m&&m.media)m.media.data=dataUrl;
      updateMediaInMessage(msgId,dataUrl,pc.type);
      delete pendingChunks[msgId]; delete receivingState[msgId];
      saveQuick();
    }
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve) => {
      if(!file){resolve(null);return;}
      const reader = new FileReader();
      reader.onload = (e) => {
        const rawDataUrl = e.target.result;
        if(!rawDataUrl){resolve(null);return;}
        if(file.type === 'image/svg+xml' || /\.svg$/i.test(file.name||'')){
          resolve(rawDataUrl); return;
        }
        if(file.type === 'image/gif' || /\.gif$/i.test(file.name||'')){
          resolve(rawDataUrl); return;
        }
        const img = new Image();
        img.onload = () => {
          try{
            let w = img.width, h = img.height;
            if(!w || !h){ resolve(rawDataUrl); return; }
            if(w > maxDim || h > maxDim){
              if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            const out = canvas.toDataURL('image/jpeg', quality);
            if(out && out.length > 100) resolve(out);
            else resolve(rawDataUrl);
          }catch(err){
            resolve(rawDataUrl);
          }
        };
        img.onerror = () => resolve(rawDataUrl);
        img.src = rawDataUrl;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  const chunkString=(str,size)=>{const chunks=[];for(let i=0;i<str.length;i+=size)chunks.push(str.substring(i,i+size));return chunks;};

  function stripForPublish(arr){
    return arr.map(m=>{
      const copy=Object.assign({},m);
      if(copy.media&&copy.media.data){copy.media=Object.assign({},copy.media);delete copy.media.data;}
      return copy;
    });
  }
  function publishMyHistory(){
    if(!client||!client.connected)return;
    client.publish(TOPIC_MINE,JSON.stringify({messages:stripForPublish(myMessages)}),{qos:1,retain:true});
  }

  function publishOneChunk(topic, payload){
    return new Promise((resolve) => {
      if(!client || !client.connected){ resolve(false); return; }
      let settled = false;
      const done = (ok) => { if(settled) return; settled = true; resolve(ok); };
      const timeout = setTimeout(() => done(false), 8000);
      try {
        client.publish(topic, payload, { qos: 1, retain: true }, (err) => {
          clearTimeout(timeout);
          done(!err);
        });
      } catch(e) {
        clearTimeout(timeout);
        done(false);
      }
    });
  }

  async function sendMediaData(dataUrl, mediaType, extraText, extraReply, durationHint){
    if(!dataUrl){alert('خطا: داده خالی');return;}
    const chunks = chunkString(dataUrl, CHUNK_SIZE);
    const msgId = uid();
    const captureText = extraText!==undefined ? extraText : msgInput.value.trim();
    const captureReply = extraReply!==undefined ? extraReply : (replyingTo ? {
      id: replyingTo.id,
      sender: replyingTo.sender,
      text: replyingTo.text,
      hasImage: replyingTo.hasImage,
      hasAudio: replyingTo.hasAudio
    } : null);

    const localMsg = {
      id: msgId, sender: myName, text: captureText, time: Date.now(), edited: false,
      media: { chunks: chunks.length, data: dataUrl, type: mediaType }
    };
    if(durationHint) localMsg.media.duration = durationHint;
    if(captureReply) localMsg.replyPreview = captureReply;

    myMessages.push(localMsg);
    publishMyHistory(); saveQuick(); renderAll(); scrollBottom(true);

    uploadIndicator.classList.remove('hidden');
    uploadText.textContent = mediaType==='audio' ? 'در حال ارسال صدا ۰٪' : 'در حال ارسال ۰٪';
    try{
      const baseTopic = CHUNK_BASE + '/' + msgId;
      for(let i = 0; i < chunks.length; i++){
        let ok = await publishOneChunk(baseTopic + '/' + i, chunks[i]);
        if(!ok){
          await delay(1500);
          ok = await publishOneChunk(baseTopic + '/' + i, chunks[i]);
        }
        if(!ok){
          await delay(2000);
          await publishOneChunk(baseTopic + '/' + i, chunks[i]);
        }
        const pct = Math.round((i+1) / chunks.length * 100);
        uploadText.textContent = (mediaType==='audio' ? 'در حال ارسال صدا ' : 'در حال ارسال ') + pct + '٪ (' + (i+1) + '/' + chunks.length + ')';
        if(i < chunks.length-1) await delay(CHUNK_DELAY);
      }
      msgInput.value = '';
      cancelReply();
      hideEmojiPanel();
    } finally {
      uploadIndicator.classList.add('hidden');
    }
  }

  async function sendImage(file){
    try{
      uploadIndicator.classList.remove('hidden');
      uploadText.textContent = 'در حال آماده‌سازی…';
      const dataUrl = await compressImage(file, IMG_MAX_DIM, IMG_QUALITY);
      uploadIndicator.classList.add('hidden');
      if(!dataUrl){ alert('خطا در خواندن عکس'); return; }
      await sendMediaData(dataUrl, 'image');
    } catch(err) {
      uploadIndicator.classList.add('hidden');
      alert('خطا: ' + (err.message || 'نامشخص'));
    }
  }

  attachBtn.onclick=()=>fileInput.click();

  function showGuideModal(){
    const ua = navigator.userAgent;
    let browser = 'مرورگرت';
    if (/SamsungBrowser/i.test(ua)) browser = 'سامسونگ اینترنت';
    else if (/Edg/i.test(ua)) browser = 'Edge';
    else if (/Chrome/i.test(ua)) browser = 'کروم';
    else if (/Firefox/i.test(ua)) browser = 'فایرفاکس';
    else if (/Safari/i.test(ua)) browser = 'سافاری';

    micGuideText.innerHTML =
      'دسترسی میکروفون برای این سایت بسته شده.<br><br>' +
      '<b>راهنما برای ' + browser + ':</b><br>' +
      '۱. روی <b>🔒</b> یا <b>ⓘ</b> کنار آدرس سایت بزن<br>' +
      '۲. گزینه <b>Permissions</b> یا <b>مجوزها</b> رو بزن<br>' +
      '۳. <b>Microphone</b> یا <b>میکروفون</b> رو پیدا کن<br>' +
      '۴. روی <b>Allow</b> یا <b>اجازه</b> بذار<br>' +

  }
  micGuideOk.onclick=()=>micGuideModal.classList.add('hidden');

  function stopRecording(cancel){
    if(!isRecording)return;
    recCanceled=!!cancel;
    isRecording=false;
    if(recTimerInterval){clearInterval(recTimerInterval);recTimerInterval=null;}
    voiceBtn.classList.remove('recording');
    recordingBar.classList.add('hidden');
    try{mediaRecorder.stop();}catch(e){}
  }

  function startRecordingWithStream(stream){
    audioStream = stream;
    try{
      mediaRecorder=new MediaRecorder(audioStream);
    }catch(err){
      alert('خطا در راه‌اندازی ضبط: '+(err.message||''));
      if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null;}
      return;
    }
    audioChunks=[];
    recCanceled=false;
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onerror=e=>{console.error('recorder error',e);};
    mediaRecorder.onstop=()=>{
      const wasCanceled=recCanceled;
      const duration=(Date.now()-recStartTime)/1000;
      const usedMime=mediaRecorder.mimeType||'audio/webm';
      if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null;}
      if(wasCanceled){audioChunks=[];return;}
      if(audioChunks.length===0)return;
      if(duration<0.5){audioChunks=[];return;}
      const blob=new Blob(audioChunks,{type:usedMime});
      audioChunks=[];
      const reader=new FileReader();
      reader.onload=async()=>{
        const dataUrl=reader.result;
        if(dataUrl.length>2.5*1024*1024){alert('صدای ضبط‌شده زیاده. کوتاه‌تر بگو.');return;}
        const captureText=msgInput.value.trim();
        const captureReply=replyingTo?{
          id:replyingTo.id,
          sender:replyingTo.sender,text:replyingTo.text,hasImage:replyingTo.hasImage,hasAudio:replyingTo.hasAudio
        }:null;
        await sendMediaData(dataUrl,'audio',captureText,captureReply,duration);
      };
      reader.readAsDataURL(blob);
    };
    try{ mediaRecorder.start(); }
    catch(err){
      alert('خطا در شروع ضبط: '+(err.message||''));
      if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null;}
      return;
    }
    isRecording=true;
    recStartTime=Date.now();
    voiceBtn.classList.add('recording');
    recordingBar.classList.remove('hidden');
    recTime.textContent='0:00';
    recTimerInterval=setInterval(()=>{
      const sec=(Date.now()-recStartTime)/1000;
      recTime.textContent=fmtDur(sec);
      if(sec>=MAX_VOICE_SEC)stopRecording(false);
    },200);
    if(navigator.vibrate)navigator.vibrate(15);
  }

  voiceBtn.onclick = async () => {
    if (isRecording) { stopRecording(false); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('مرورگرت از ضبط صدا پشتیبانی نمی‌کنه.');
      return;
    }
    if (typeof MediaRecorder === 'undefined') {
      alert('مرورگرت MediaRecorder رو پشتیبانی نمی‌کنه.');
      return;
    }
    if (!window.isSecureContext) {
      alert('این صفحه باید با HTTPS باز بشه تا میکروفون کار کنه.');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      startRecordingWithStream(stream);
    } catch (err) {
      console.error('getUserMedia error:', err);
      const name = err.name || '';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') showGuideModal();
      else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') alert('میکروفونی پیدا نشد.');
      else if (name === 'NotReadableError' || name === 'TrackStartError') alert('میکروفون در استفاده‌ست.');
      else alert('خطا: ' + name);
    }
  };

  $('recCancel').onclick=()=>stopRecording(true);
  $('recSend').onclick=()=>stopRecording(false);

  lightbox.onclick=e=>{
    if(e.target===lightbox||e.target.classList.contains('close')){
      lightbox.classList.add('hidden'); lightboxImg.src='';
    }
  };

  function publishDeleted(){
    if(!client||!client.connected)return;
    client.publish(TOPIC_DELETED,JSON.stringify({ids:[...deletedIds]}),{qos:1,retain:true});
  }
  function publishSeen(force){
    const now=Date.now();
    if(!force&&now-lastSeenPublish<800)return;
    lastSeenPublish=now;
    if(!client||!client.connected)return;
    try{client.publish(TOPIC_SEEN_MINE,JSON.stringify({t:now}),{qos:1,retain:true});}catch(e){}
  }
  function startSeenHeartbeat(){
    if(seenHeartbeat)clearInterval(seenHeartbeat);
    seenHeartbeat=setInterval(()=>{if(myName&&client&&client.connected)publishSeen(true);},4000);
  }
  function startStatusTimer(){
    if(statusTimer)clearInterval(statusTimer);
    statusTimer=setInterval(updatePeerStatus,30000);
  }

  function connectMQTT(){
    if(typeof mqtt==='undefined'){setTimeout(connectMQTT,500);return;}
    client=mqtt.connect(BROKER,{
      clientId:'chat_'+Math.random().toString(16).slice(2,12),
      clean:true,reconnectPeriod:1000,connectTimeout:5000,keepalive:30
    });
    client.on('connect',()=>{
      client.subscribe(TOPIC_MINE,{qos:1});
      client.subscribe(TOPIC_THEIRS,{qos:1});
      client.subscribe(TOPIC_DELETED,{qos:1});
      client.subscribe(TOPIC_SEEN_THEIRS,{qos:1});
      client.subscribe(REACTION_BASE+'/#',{qos:1});
      client.subscribe(TOPIC_THEME_MINE,{qos:1});
      client.subscribe(TOPIC_TYPING_THEIRS,{qos:0});
      client.subscribe(TOPIC_AVATAR_MINE,{qos:1});
      client.subscribe(TOPIC_AVATAR_THEIRS,{qos:1});
      client.subscribe(TOPIC_WALL_MINE,{qos:1});
      for(const msgId in pendingChunks) ensureChunkSubscription(msgId);
      publishSeen(true);
      setTimeout(()=>publishSeen(true),500);
      startSeenHeartbeat();
    });
    client.on('error',e=>console.error('MQTT error',e));
    client.on('reconnect',()=>{
      setTimeout(()=>{
        if(!client||!client.connected)return;
        for(const msgId in pendingChunks) ensureChunkSubscription(msgId);
      }, 1000);
    });
    client.on('message',(topic,payload)=>{
      if(CHUNK_BASE&&topic.startsWith(CHUNK_BASE+'/')){handleChunkMessage(topic,payload);return;}

      if(REACTION_BASE&&topic.startsWith(REACTION_BASE+'/')){
        const msgId=topic.slice(REACTION_BASE.length+1);
        let data; try{data=JSON.parse(payload.toString());}catch{return;}
        const r=data.r||{};
        remoteReactions[msgId]=r;
        const m=myMessages.find(x=>x.id===msgId)||theirMessages.find(x=>x.id===msgId);
        if(m){m.reactions=r;}
        const rec=messagesById[msgId];
        if(rec){rec.data.reactions=r;updateMessageReactions(msgId,r);}
        saveQuick();
        return;
      }
      if(topic===TOPIC_THEME_MINE){
        try{
          const d=JSON.parse(payload.toString());
          if(d.theme){
            const cur=localStorage.getItem('chat_theme_'+myName);
            if(d.theme!==cur)applyTheme(d.theme,false);
          }
        }catch(e){}
        return;
      }
      if(topic===TOPIC_AVATAR_MINE){
        try{
          const raw=payload.toString();
          if(!raw){
            const cur=localStorage.getItem('chat_avatar_'+myName);
            if(cur){localStorage.removeItem('chat_avatar_'+myName);applyMyAvatar(null);}
          }else{
            const d=JSON.parse(raw);
            if(d.data){
              const cur=localStorage.getItem('chat_avatar_'+myName);
              if(d.data!==cur){try{localStorage.setItem('chat_avatar_'+myName,d.data);}catch(e){}applyMyAvatar(d.data);}
            }
          }
        }catch(e){}
        return;
      }
      if(topic===TOPIC_AVATAR_THEIRS){
        try{
          const raw=payload.toString();
          if(!raw){applyPeerAvatar(null);}
          else{const d=JSON.parse(raw);applyPeerAvatar(d.data||null);}
        }catch(e){}
        return;
      }
      if(topic===TOPIC_WALL_MINE){
        try{
          const raw=payload.toString();
          if(!raw){
            const cur=localStorage.getItem('chat_wall_'+myName);
            if(cur){localStorage.removeItem('chat_wall_'+myName);applyWallpaper(null);}
          }else{
            const d=JSON.parse(raw);
            if(d.data){
              const cur=localStorage.getItem('chat_wall_'+myName);
              if(d.data!==cur){try{localStorage.setItem('chat_wall_'+myName,d.data);}catch(e){}applyWallpaper(d.data);}
            }
          }
        }catch(e){}
        return;
      }
      if(topic===TOPIC_TYPING_THEIRS){
        const txt=payload.toString();
        if(txt==='1')showPeerTyping();
        else if(txt===''){if(peerTypingTimeout){clearTimeout(peerTypingTimeout);peerTypingTimeout=null;}updatePeerStatus();}
        return;
      }
      let data; try{data=JSON.parse(payload.toString());}catch{return;}
      if(topic===TOPIC_MINE){
        const serverMsgs=data.messages||[];
        if (serverMsgs.length === myMessages.length) {
          let same = true;
          for (let i = 0; i < serverMsgs.length; i++) {
            if (serverMsgs[i].id !== myMessages[i].id || serverMsgs[i].text !== myMessages[i].text || serverMsgs[i].edited !== myMessages[i].edited) {
              same = false; break;
            }
          }
          if (same) return;
        }
        myMessages=mergeById(serverMsgs,myMessages);
        saveQuick(); renderAll();
        return;
      }
      if(topic===TOPIC_THEIRS){
        const serverMsgs=data.messages||[];
        const prevCount=theirMessages.length;
        theirMessages=mergeById(serverMsgs,theirMessages);
        theirMessages.forEach(m=>{
          const rec=messagesById[m.id];
          if(rec){
            if(rec.data.text!==m.text||rec.data.edited!==m.edited){
              rec.data.text=m.text;rec.data.edited=m.edited;
              updateMessageText(m.id,m.text,m.edited);
            }
          }
          if(m.media && m.media.chunks && !m.media.data && !pendingChunks[m.id]){
            startReceiving(m);
          }
        });
        saveQuick(); renderAll();
        if(theirMessages.length>prevCount){
          publishSeen(true);
          if(peerTypingTimeout){clearTimeout(peerTypingTimeout);peerTypingTimeout=null;}
          updatePeerStatus();
        }else publishSeen();
        return;
      }
      if(topic===TOPIC_DELETED){
        const arr=data.ids||[];
        let changed=false;
        arr.forEach(id=>{
          if(!deletedIds.has(id)){
            deletedIds.add(id);
            changed=true;
            removeMessage(id);
            myMessages = myMessages.filter(m=>m.id!==id);
            theirMessages = theirMessages.filter(m=>m.id!==id);
          }
        });
        if(changed){
          try{
            const raw=localStorage.getItem(quickKey(myName));
            if(raw){
              const p=JSON.parse(raw);
              p.deleted=[...deletedIds];
              localStorage.setItem(quickKey(myName), JSON.stringify(p));
            }
          }catch(e){}
          publishDeleted();
          renderAll();
        }
        return;
      }
      if(topic===TOPIC_SEEN_THEIRS){
        const t=data.t||0;
        if(t>peerSeenUpTo){peerSeenUpTo=t;saveQuick();updateAllTicks();updatePeerStatus();}
        return;
      }
    });
  }

  function tryLogin(code){
    let user=null;
    if(code===CODES.Hatami)user='Hatami';
    else if(code===CODES.Armin)user='Armin';
    else{loginError.textContent='کد اشتباهه';return;}
    loginError.textContent='';
    startSession(user,code);
  }

  async function startSession(user, code){
    myName=user;
    const otherName=(user==='Hatami')?'Armin':'Hatami';
    peerNameEl.textContent=otherName;
    myNameValue.textContent=myName;
    localStorage.setItem('chat_user',user);
    localStorage.setItem('chat_code',code);

    applyTheme(localStorage.getItem('chat_theme_'+myName)||'black',false);
    loadAvatarFromCache();
    loadWallpaperFromCache();

    loadQuick();
    messagesById={}; pendingChunks={}; receivingState={};
    messagesEl.innerHTML='';
    renderAll(); scrollBottom(false); updatePeerStatus();

    loginEl.classList.add('hidden');
    chatEl.classList.remove('hidden');

    ROOM_HASH=await getRoomHash();
    TOPIC_MINE         ='pc/'+ROOM_HASH+'/H/'+myName;
    TOPIC_THEIRS       ='pc/'+ROOM_HASH+'/H/'+otherName;
    TOPIC_DELETED      ='pc/'+ROOM_HASH+'/D';
    TOPIC_SEEN_MINE    ='pc/'+ROOM_HASH+'/S/'+myName;
    TOPIC_SEEN_THEIRS  ='pc/'+ROOM_HASH+'/S/'+otherName;
    CHUNK_BASE         ='pc/'+ROOM_HASH+'/C';
    REACTION_BASE      ='pc/'+ROOM_HASH+'/R';
    TOPIC_THEME_MINE   ='pc/'+ROOM_HASH+'/T/'+myName;
    TOPIC_TYPING_MINE  ='pc/'+ROOM_HASH+'/TY/'+myName;
    TOPIC_TYPING_THEIRS='pc/'+ROOM_HASH+'/TY/'+otherName;
    TOPIC_AVATAR_MINE  ='pc/'+ROOM_HASH+'/AV/'+myName;
    TOPIC_AVATAR_THEIRS='pc/'+ROOM_HASH+'/AV/'+otherName;
    TOPIC_WALL_MINE    ='pc/'+ROOM_HASH+'/WP/'+myName;

    connectMQTT();
    startStatusTimer();
    setTimeout(()=>msgInput.focus(),150);
  }

  function logout(){
    if(myName)saveQuick();
    if(isRecording)stopRecording(true);
    if(seenHeartbeat){clearInterval(seenHeartbeat);seenHeartbeat=null;}
    if(statusTimer){clearInterval(statusTimer);statusTimer=null;}
    if(peerTypingTimeout){clearTimeout(peerTypingTimeout);peerTypingTimeout=null;}
    if(client){try{client.end(true);}catch(e){}client=null;}
    localStorage.removeItem('chat_user');
    localStorage.removeItem('chat_code');

    myName=null;
    myMessages=[]; theirMessages=[];
    deletedIds=new Set(); hiddenIds=new Set();
    messagesById={}; pendingChunks={}; receivingState={};
    pendingDeleteId=null; editingId=null; replyingTo=null;
    peerSeenUpTo=0; lastSeenPublish=0;
    remoteReactions={};

    messagesEl.innerHTML='';
    messagesEl.style.backgroundImage='';
    messagesEl.classList.remove('has-wallpaper');
    peerAvatarEl.querySelectorAll('img').forEach(i=>i.remove());
    peerAvatarDefault.style.display='';
    peerDotEl.className='status-dot offline';
    applyMyAvatar(null);
    wallpaperValue.textContent=''; clearWallpaper.classList.add('hidden');

    codeInput.value=''; loginError.textContent='';
    replyBanner.classList.add('hidden');
    deleteModal.classList.add('hidden');
    micGuideModal.classList.add('hidden');
    uploadIndicator.classList.add('hidden');
    lightbox.classList.add('hidden');
    recordingBar.classList.add('hidden');
    hideEmojiPanel(); hideReactionPicker(); hideThemeSheet();

    chatEl.classList.add('hidden');
    applyTheme('black',false);
    loginEl.classList.remove('hidden');
    setTimeout(()=>codeInput.focus(),200);
  }
  $('logoutBtn').onclick=logout;

  $('enterBtn').onclick=()=>{
    const code=codeInput.value.trim();
    if(!code){loginError.textContent='کد رو وارد کن';return;}
    tryLogin(code);
  };
  codeInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('enterBtn').click();}});

  ['touchstart','mousedown','keydown','scroll'].forEach(ev=>{
    messagesEl.addEventListener(ev,()=>{if(myName)publishSeen();},{passive:true});
    document.addEventListener(ev,()=>{if(myName&&!document.hidden)publishSeen();},{passive:true});
  });

  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&myName)publishSeen(true);});
  window.addEventListener('pagehide',()=>{if(myName)saveQuick();});
  window.addEventListener('beforeunload',()=>{if(myName)saveQuick();});
  setInterval(()=>{if(myName)saveQuick();},20000);

  buildThemeGrid();

  const savedUser=localStorage.getItem('chat_user');
  const savedCode=localStorage.getItem('chat_code');
  if(savedUser&&savedCode){
    const stillValid=(savedUser==='Hatami'&&savedCode===CODES.Hatami)||(savedUser==='Armin'&&savedCode===CODES.Armin);
    if(stillValid)startSession(savedUser,savedCode);
    else{localStorage.removeItem('chat_user');localStorage.removeItem('chat_code');}
  }
})();
